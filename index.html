<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rig Site Inventory</title>
<style>
:root{--bg:#eceff1;--sf:#fff;--tx:#14202a;--mu:#62707b;--bd:#cfd6db;--ac:#0b5cab;--ac2:#e3eefa;--in:#14783f;--out:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181d;--sf:#1b242b;--tx:#e8edf0;--mu:#93a1ab;--bd:#33414b;--ac:#5aa7f0;--ac2:#1f3345;--in:#4cc38a;--out:#ff8a80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181d;--sf:#1b242b;--tx:#e8edf0;--mu:#93a1ab;--bd:#33414b;--ac:#5aa7f0;--ac2:#1f3345;--in:#4cc38a;--out:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
label{display:flex;align-items:center;gap:6px;color:var(--mu)}
.pronly{display:none}
h3{font-size:15px;margin:14px 0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 12px}
.card{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.card b{font-size:20px;line-height:1.3}
body.view .mo{display:none!important}
body.locked header,body.locked #tabs,body.locked main{display:none!important}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:24px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.gbox .logo{align-self:center;height:56px}.gbox h2{margin:0}.gbox button{width:100%;padding:12px}.gbox label{flex-direction:column;align-items:stretch;text-align:left}
#g1,#g2,#g3{display:flex;flex-direction:column;gap:10px}
.logo{height:40px;width:auto;background:#fff;border-radius:6px;padding:3px 8px}
@media print{header,#tabs,#fb,#ib,#list,.noprint,#rep .row{display:none!important}.pronly{display:block}main{display:block;padding:0}body.plist #det{display:none!important}body.plist #list{display:block!important}*{color:#000!important;background:#fff!important}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}
h1{font-size:20px;margin:0;flex:1 1 auto}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;min-width:0}
button{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 16px 0;background:var(--sf);border-bottom:1px solid var(--bd)}
.tab{border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;white-space:nowrap;background:none;color:var(--mu)}
.tab span{font-size:12px;margin-left:4px}
.tab.on{background:var(--bg);border-color:var(--bd);color:var(--tx);font-weight:600;margin-bottom:-1px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media (max-width:800px){main{grid-template-columns:1fr}}
section{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px}
h2{font-size:16px;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.row input{flex:1 1 90px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-weight:500;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.it{cursor:pointer}
tr.it:hover,tr.sel{background:var(--ac2)}
.in{color:var(--in);font-weight:600}.out{color:var(--out);font-weight:600}
.big{font-size:28px;font-weight:700}
.mu{color:var(--mu)}
.x{padding:2px 8px}
</style><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b7a3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JNL Inventory">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head><body class="locked">
<div id="gate"><div class="gbox"><img id="gl" class="logo" alt="JNL"><h2>Rig Site Inventory</h2>
<div id="g1"><button class="p" id="gm">Master account</button><button id="gv">View only</button></div>
<div id="g2" hidden><label>Email <input id="gem" type="email" autocomplete="username"></label><label>Password <input id="gp" type="password" autocomplete="current-password"></label><p id="ge" class="out" role="alert"></p><button class="p" id="gok">Enter</button><button id="gb">Back</button></div>
<div id="g3" hidden><label>Password <input id="gvp" type="password" autocomplete="off"></label><p id="gve" class="out" role="alert"></p><button class="p" id="gvok">Enter</button><button id="gvb">Back</button></div>
</div></div>
<header>
<img id="lg" class="logo" alt="JNL">
<h1>Rig Site Inventory</h1>
<span id="st" class="mu" role="status"></span>
<input id="q" type="search" placeholder="Search items (separate with commas)" aria-label="Search items">
<button id="bwb" class="mo">Batch withdraw</button><button id="rpt">Date report</button><button id="csv">Export CSV</button><button id="exp" class="mo">Backup</button>
<button id="imp">Restore</button><button id="xex">Export Excel</button><button id="ximp">Import Excel</button><input id="xfile" type="file" accept=".xlsx,.xls" hidden><button id="out">Log out</button><input id="file" type="file" accept=".json" hidden>
</header>
<nav id="tabs" role="tablist"></nav>
<div id="ib" hidden style="padding:10px 16px;background:var(--ac2)"><p id="ibt" style="margin:0 0 8px"></p><div class="row" style="margin:0"><button class="p" id="ibr">Replace all data</button><button id="iba">Add new items only</button><button id="ibc">Cancel</button></div></div>
<div id="fb" hidden style="padding:8px 16px;background:var(--ac2);display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span id="fbt"></span><button id="fbx">Back to live data</button><button id="fbd">Delete saved copy</button></div>
<main id="mn"><section id="list"></section><section id="det"></section></main>
<main id="rm" hidden><section id="rep" style="grid-column:1/-1"></section></main>
<main id="bm" hidden><section id="bt" style="grid-column:1/-1"></section></main>
<script>
const CATS=["Accumulator","Drawworks","Mud Pump","Mud System","BOP","SCR","Top Drive & ST80","Lift","Handling Tools & Rotating","Generator","Electrical","Consumables"];
const K="rig-inv-v1";
let S={items:[]},cat=0,sel=null,q="",armed=null;
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}queueSync()};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bal=i=>i.tx.reduce((a,t)=>a+(t.type==="IN"?t.q:-t.q),0);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const find=id=>S.items.find(x=>x.id===id);

function render(){
  $("tabs").innerHTML=`<button class="tab${cat===-1?" on":""}" role="tab" data-tab="-1">All Items<span>${S.items.length}</span></button>`+CATS.map((c,i)=>`<button class="tab${i===cat?" on":""}" role="tab" data-tab="${i}">${esc(c)}<span>${S.items.filter(x=>x.cat===i).length}</span></button>`).join("");
  renderList();renderDet();
}
function renderList(){
  const items=S.items.filter(x=>(cat===-1||x.cat===cat)&&(!terms(q).length||terms(q).some(w=>(x.name+" "+(x.pn||"")+" "+(x.loc||"")).toLowerCase().includes(w)))&&(!SUBS[cat]||sub==="ALL"||(SUBS[cat].includes(x.sub)?x.sub:"NONE")===sub)).sort((a,b)=>cat===-1?a.name.localeCompare(b.name):0);
  shown=items;
  $("list").innerHTML=`<img class="logo pronly" src="${LOGO}" alt="JNL">
  <h2>${cat===-1?"All Items (A to Z)":esc(CATS[cat])}</h2>
  ${SUBS[cat]?subBar():""}
  <p class="pronly">Stock list as of ${today()}${SUBS[cat]&&sub!=="ALL"?", "+esc(sub==="NONE"?"Unassigned":sub):""}</p>
  <div class="row noprint"><button data-act="sprint">Print stock list</button><button data-act="scsv">Export stock CSV</button></div>
  ${cat===-1?`<p class="mu">This list shows every item from all tabs. Add new items inside their own tab.</p>`:`<div class="row noprint mo"><input id="nn" placeholder="New item name" aria-label="Item name"><input id="nu" placeholder="Unit (pcs, set…)" aria-label="Unit"><input id="np" placeholder="Part no. (optional)" aria-label="Part number"><input id="nl" placeholder="Location (optional)" aria-label="Location"><input id="no" type="number" min="0" placeholder="Opening stock" aria-label="Opening stock"><input id="nd" type="date" value="${today()}" aria-label="Date added" title="Date added">${SUBS[cat]?`<select id="ns" aria-label="Section">${SUBS[cat].map(s=>`<option${s===sub?" selected":""}>${esc(s)}</option>`).join("")}</select>`:""}<button class="p" data-act="add">Add item</button></div>`}
  ${items.length?`<div class="scroll"><table><thead><tr><th>Item</th><th class="n">In stock</th></tr></thead><tbody>${items.map(i=>`<tr class="it${i.id===sel?" sel":""}" tabindex="0" data-item="${i.id}"><td>${esc(i.name)}${i.pn?` <span class="mu">P/N ${esc(i.pn)}</span>`:""}${i.loc?` <span class="mu">Loc: ${esc(i.loc)}</span>`:""}${cat===-1?` <span class="mu">${esc(CATS[i.cat])}${i.sub?" / "+esc(i.sub):""}</span>`:""}</td><td class="n">${bal(i)} <span class="mu">${esc(i.unit)}</span></td></tr>`).join("")}</tbody></table></div>`:`<p class="mu">${q?"No items match your search.":"No items in this tab yet. Add the first item above."}</p>`}`;
}
function renderDet(){
  const i=find(sel);
  if(!i||(cat!==-1&&i.cat!==cat)){$("det").innerHTML=`<h2>Item history</h2><p class="mu">Click an item to see its stock in, stock out and who withdrew it.</p>`;return}
  let run=0;
  const rows=[...i.tx].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).map(t=>{run+=t.type==="IN"?t.q:-t.q;return{...t,b:run}}).filter(t=>(!hf||t.d>=hf)&&(!ht||t.d<=ht)).reverse();
  $("det").innerHTML=`<img class="logo pronly" src="${LOGO}" alt="JNL">
  <h2>${esc(i.name)}</h2>
  ${i.pn?`<p class="pronly">Part no. ${esc(i.pn)}</p>`:""}${i.loc?`<p class="pronly">Location: ${esc(i.loc)}</p>`:""}<p class="noprint mo"><label>Part no. <input id="ip" value="${esc(i.pn||"")}" placeholder="optional"></label> <label>Location <input id="il" value="${esc(i.loc||"")}" placeholder="optional"></label></p>
  ${SUBS[i.cat]?`<p class="noprint mo"><label>Section <select id="is"><option value="">Unassigned</option>${SUBS[i.cat].map(s=>`<option${i.sub===s?" selected":""}>${esc(s)}</option>`).join("")}</select></label></p>${i.sub?`<p class="pronly">${esc(i.sub)}</p>`:""}`:""}
  <div class="big">${bal(i)} <span class="mu" style="font-size:15px;font-weight:400">${esc(i.unit)} in stock</span></div>
  <div class="row noprint mo" style="margin-top:12px">
   <select id="tt" aria-label="Type"><option value="IN">Stock in</option><option value="OUT">Stock out</option></select>
   <input id="tq" type="number" min="1" placeholder="Qty" aria-label="Quantity">
   <input id="td" type="date" value="${today()}" aria-label="Date">
   <input id="tw" placeholder="Received from / Withdrawn by" aria-label="Name">
   <input id="tn" placeholder="Remarks (rig, job, PO…)" aria-label="Remarks">
   <button class="p" data-act="tx">Save entry</button></div>
  <p id="err" class="out noprint" role="alert"></p>
  <p class="pronly">Printed ${today()}${hf||ht?". Showing "+(hf||"start")+" to "+(ht||"latest"):""}</p>
  <div class="row noprint"><label>History from <input id="hf" type="date" value="${hf}"></label><label>to <input id="ht" type="date" value="${ht}"></label><button data-act="hclr">Show all dates</button><button data-act="hprint">Print history</button><button data-act="dtl">${dv?"Hide details":"View more details"}</button></div>
  <p class="mu">${rows.length} entries shown: ${rows.filter(t=>t.type==="IN").reduce((a,t)=>a+t.q,0)} ${esc(i.unit)} in, ${rows.filter(t=>t.type==="OUT").reduce((a,t)=>a+t.q,0)} ${esc(i.unit)} out</p>
  ${dv?detHtml(i,rows):""}
  ${rows.length?`<div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th class="n">Qty</th><th>Name</th><th>Remarks</th><th class="n">Balance</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.d)}</td><td class="${t.type==="IN"?"in":"out"}">${t.type==="IN"?"Stock in":"Stock out"}</td><td class="n">${t.q}</td><td>${esc(t.w)}</td><td>${esc(t.n)}</td><td class="n">${t.b}</td><td><button class="x noprint mo" data-del="${t.id}" aria-label="Delete entry">${armed===t.id?"Sure?":"✕"}</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="mu">No history yet. Record the first stock in above.</p>`}
  <p class="noprint mo"><button data-act="rm">${armed==="item"?"Sure? Delete item and history":"Delete item"}</button></p>`;
}
function err(m){const e=$("err");if(e)e.textContent=m}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-item],[data-act],[data-del],[data-sub]");
  if(!t)return;
  if(role!=="master"&&(t.dataset.act==="add"||t.dataset.act==="tx"||t.dataset.del||t.dataset.act==="rm"))return;
  armed=t.dataset.del||t.dataset.act==="rm"?armed:null;
  if(t.dataset.tab!==undefined){cat=+t.dataset.tab;sub="ALL";sel=null;q="";$("q").value="";render()}
  else if(t.dataset.item){sel=t.dataset.item;armed=null;renderList();renderDet()}
  else if(t.dataset.act==="add"){
    const name=$("nn").value.trim();if(!name)return $("nn").focus();
    const it={id:uid(),cat,name,unit:$("nu").value.trim()||"pcs",pn:$("np").value.trim(),loc:$("nl").value.trim(),sub:$("ns")?$("ns").value:"",tx:[]};
    const o=parseInt($("no").value);
    if(o>0)it.tx.push({id:uid(),type:"IN",q:o,d:$("nd").value||today(),w:"",n:"Opening stock"});
    S.items.push(it);sel=it.id;save();render()}
  else if(t.dataset.act==="tx"){
    const i=find(sel),type=$("tt").value,qty=parseInt($("tq").value),w=$("tw").value.trim();
    if(!(qty>0))return err("Enter a quantity greater than 0.");
    
    if(type==="OUT"&&qty>bal(i))return err("Only "+bal(i)+" "+i.unit+" in stock.");
    i.tx.push({id:uid(),type,q:qty,d:$("td").value||today(),w,n:$("tn").value.trim()});
    save();render()}
  else if(t.dataset.del){
    if(armed!==t.dataset.del){armed=t.dataset.del;return renderDet()}
    const i=find(sel);i.tx=i.tx.filter(x=>x.id!==armed);armed=null;
    if(bal(i)<0){i.tx.push({id:uid(),type:"IN",q:-bal(i),d:today(),w:"",n:"Adjustment"})}
    save();render()}
  else if(t.dataset.sub){sub=t.dataset.sub;sel=null;renderList();renderDet()}
  else if(t.dataset.act==="dtl"){dv=!dv;renderDet()}
  else if(t.dataset.act==="sprint"){document.body.classList.add("plist");try{window.print()}catch(x){}setTimeout(()=>document.body.classList.remove("plist"),1500)}
  else if(t.dataset.act==="scsv"){const c=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';const L=[["Tab","Section","Item","Part No","Location","Stock","Unit","As of"].map(c).join(",")];shown.forEach(i=>L.push([CATS[i.cat],i.sub||"",i.name,i.pn||"",i.loc||"",bal(i),i.unit,today()].map(c).join(",")));dl("stock-"+(cat===-1?"all":CATS[cat].replace(/[^A-Za-z0-9]+/g,"-"))+"-"+today()+".csv",L.join("\n"),"text/csv")}
  else if(t.dataset.act==="hclr"){hf="";ht="";renderDet()}
  else if(t.dataset.act==="hprint"){try{window.print()}catch(x){}}
  else if(t.dataset.act==="rm"){
    if(armed!=="item"){armed="item";return renderDet()}
    S.items=S.items.filter(x=>x.id!==sel);sel=null;armed=null;save();render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.item){sel=e.target.dataset.item;renderList();renderDet()}});
$("q").addEventListener("input",e=>{q=e.target.value;renderList()});
async function saveAs(data,def,key,mime,ext){
  let nm=def;try{nm=localStorage.getItem("rig-name-"+key)||def}catch(e){}
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({id:key,startIn:"documents",suggestedName:nm,types:[{description:ext.slice(1).toUpperCase()+" file",accept:{[mime]:[ext]}}]});
      const w=await h.createWritable();await w.write(data);await w.close();
      try{localStorage.setItem("rig-name-"+key,h.name)}catch(e){}
      stat("Saved: "+h.name);return;
    }catch(e){if(e&&e.name==="AbortError")return}
  }
  dl(nm,data,mime);
  stat("Downloaded as "+nm+". This browser view can't choose the folder.");
}
$("exp").onclick=()=>saveAs(JSON.stringify(S),"rig-inventory-backup.json","rig-backup","application/json",".json");
let plan=null;
function needX(){if(window.XLSX)return Promise.resolve(true);return new Promise(res=>{const el=document.createElement("script");el.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";el.onload=()=>res(!!window.XLSX);el.onerror=()=>res(false);document.head.appendChild(el)})}
$("xex").onclick=async()=>{
  if(!await needX()){stat("Could not load the Excel library. Check your internet connection.");return}
  const items=[...S.items].sort((a,b)=>a.cat-b.cat||a.name.localeCompare(b.name));
  const I=items.map(i=>({"ID":i.id,"Tab":CATS[i.cat],"Section":i.sub||"","Item":i.name,"Part No":i.pn||"","Location":i.loc||"","Unit":i.unit,"Current Stock":bal(i)}));
  const T=[];items.forEach(i=>[...i.tx].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).forEach(t=>T.push({"Item ID":i.id,"Tab":CATS[i.cat],"Item":i.name,"Date":t.d,"Type":t.type==="IN"?"Stock in":"Stock out","Qty":t.q,"Name":t.w||"","Remarks":t.n||""})));
  const wb=XLSX.utils.book_new();
  const w1=XLSX.utils.json_to_sheet(I,{header:["ID","Tab","Section","Item","Part No","Location","Unit","Current Stock"]});
  w1["!cols"]=[{wch:10},{wch:24},{wch:14},{wch:36},{wch:16},{wch:18},{wch:8},{wch:14}];
  const w2=XLSX.utils.json_to_sheet(T,{header:["Item ID","Tab","Item","Date","Type","Qty","Name","Remarks"]});
  w2["!cols"]=[{wch:10},{wch:24},{wch:36},{wch:12},{wch:10},{wch:8},{wch:20},{wch:30}];
  XLSX.utils.book_append_sheet(wb,w1,"Items");XLSX.utils.book_append_sheet(wb,w2,"Transactions");
  saveAs(XLSX.write(wb,{bookType:"xlsx",type:"array"}),"rig-inventory.xlsx","rig-excel","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",".xlsx");
};
function parseX(buf){
  const wb=XLSX.read(buf,{type:"array"});
  if(!wb.Sheets["Items"])throw new Error("The file needs a sheet named Items.");
  const rows=ws=>ws?XLSX.utils.sheet_to_json(ws,{defval:""}):[];
  const g=(r,k)=>{const key=Object.keys(r).find(x=>x.trim().toLowerCase()===k);return key===undefined?"":r[key]};
  const pad=n=>String(n).padStart(2,"0");
  const dateOf=v=>{
    if(typeof v==="number"){const q=XLSX.SSF.parse_date_code(v);return q?q.y+"-"+pad(q.m)+"-"+pad(q.d):""}
    const m=String(v).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
    const d=new Date(v);return isNaN(d)||!String(v).trim()?"":d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  const catOf=v=>CATS.findIndex(c=>c.toLowerCase()===String(v).trim().toLowerCase());
  const items=[],byId={},byKey={};let errors=0,nTx=0;
  rows(wb.Sheets["Items"]).forEach(r=>{
    const name=String(g(r,"item")).trim();if(!name)return;
    const cat=catOf(g(r,"tab"));if(cat<0){errors++;return}
    const sv=String(g(r,"section")).trim().toLowerCase();
    const sub=(SUBS[cat]||[]).find(x=>x.toLowerCase()===sv)||"";
    const it={id:String(g(r,"id")).trim()||uid(),cat,name,unit:String(g(r,"unit")).trim()||"pcs",pn:String(g(r,"part no")).trim(),loc:String(g(r,"location")).trim(),sub,tx:[]};
    if(byId[it.id])it.id=uid();
    const op=Math.round(Number(g(r,"opening stock")));
    if(op>0){it.tx.push({id:uid(),type:"IN",q:op,d:today(),w:"",n:"Opening stock"});nTx++}
    items.push(it);byId[it.id]=it;byKey[cat+"|"+name.toLowerCase()]=it;
  });
  rows(wb.Sheets["Transactions"]).forEach(r=>{
    const iid=String(g(r,"item id")).trim(),nm=String(g(r,"item")).trim().toLowerCase(),cat=catOf(g(r,"tab"));
    const it=byId[iid]||byKey[cat+"|"+nm];
    const ty=String(g(r,"type")).trim().toLowerCase(),type=/^(in|stock in|received|receive)/.test(ty)?"IN":/^(out|stock out|withdraw)/.test(ty)?"OUT":"";
    const q=Math.round(Number(g(r,"qty"))),d=dateOf(g(r,"date"));
    if(!it||!type||!(q>0)||!d){if(String(g(r,"item")).trim()||iid)errors++;return}
    it.tx.push({id:uid(),type,q,d,w:String(g(r,"name")).trim(),n:String(g(r,"remarks")).trim()});nTx++;
  });
  return{items,errors,nTx};
}
